<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zensite focus-session timer.">
  <title>Zensite | Focus session</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="timer-page">
  <header class="site-header">
    <a class="brand" href="page-1.html" aria-label="Return to Zensite start">zensite</a>
        <!--<button class="icon-button" type="button" aria-label="Open settings" title="Settings"> </button>!-->
  </header>

  <main class="page-content">
    <section class="timer-card" aria-labelledby="timer-title">
      <p class="eyebrow">Your focus session</p>
      <h1 id="timer-title" class="session-goal">Settle in.</h1>

      <div class="timer-wrap" role="timer" aria-live="off" aria-label="Time remaining">
        <svg class="timer-ring" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="timer-ring-track" cx="120" cy="120" r="105"></circle>
          <circle class="timer-ring-progress" cx="120" cy="120" r="105"></circle>
        </svg>
        <div class="timer-readout">
          <time id="time-remaining" datetime="PT25M">25:00</time>
          <span>remaining</span>
        </div>
      </div>

      <div class="timer-controls">
        <button id="pause-button" class="primary-button" type="button">Pause session</button>
        <button id="end-button" class="text-button" type="button">End session early</button>
      </div>

      <div class="ambience-panel">
        <p class="ambience-label">Ambience: <span id="ambience-name">None</span></p>
        <button id="sound-button" class="secondary-button" type="button" disabled>Sound unavailable</button>
      </div>

      <div id="completion-message" class="completion-message" hidden aria-live="polite">
        <div class="session-complete" aria-hidden="true">&#10003;</div>
        <h2>Session complete.</h2>
        <p>Nice work showing up for your goal.</p>
        <a class="primary-button" id="reflect-button" href="page-3.html">Reflect on your session</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">Made for one thing at a time.</footer>
  <script src="script/script.js"></script>
</body>
</html>
